name: Application and PostgreSQL tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gesture_test
          POSTGRES_PASSWORD: ci_only_disposable_password
          POSTGRES_DB: gesture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gesture_test -d gesture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      TEST_DATABASE_URL: postgresql://gesture_test:ci_only_disposable_password@localhost:5432/gesture_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_sensor_model.py
      - run: python tests/test_application.py
      - run: node tests/test_auth_ui.js
      - run: python tests/test_postgres_live.py
      - run: python tests/acceptance_probe.py
