name: Verify trained TF-C artifacts (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify actual trained files and reproducible metrics
        run: python scripts/verify_tfc_release.py
      - name: Check inference and data preprocessing
        run: |
          python tests/test_tfc.py
          python -m unittest test_sensor_model.py
